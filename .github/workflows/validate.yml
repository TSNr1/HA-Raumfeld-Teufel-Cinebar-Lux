name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp voluptuous
      - name: Unit tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee test.log
      - name: Fehlerausgabe als Hinweis
        if: failure()
        run: echo "::error::$(grep -v '^$' test.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
